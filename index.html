<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariam's Learning World</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --pink: #FF6B9D;
            --purple: #C084FC;
            --blue: #60A5FA;
            --green: #4ADE80;
            --yellow: #FACC15;
            --orange: #FB923C;
            --red: #F87171;
            --bg: #FFF7ED;
            --teal: #2DD4BF;
        }

        body {
            font-family: 'Baloo 2', cursive;
            background: var(--bg);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 20% 80%, rgba(192, 132, 252, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(96, 165, 250, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 107, 157, 0.05) 0%, transparent 50%);
        }

        .arabic-text {
            font-family: 'Noto Naskh Arabic', serif;
        }

        /* ---- STAR COUNTER (persistent) ---- */
        .star-counter {
            position: fixed;
            top: 20px;
            right: 25px;
            background: white;
            border-radius: 50px;
            padding: 8px 20px;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--orange);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.3s;
            animation: star-shimmer 3s ease-in-out infinite;
        }

        @keyframes star-shimmer {
            0%, 100% { box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
            50% { box-shadow: 0 4px 25px rgba(250, 204, 21, 0.4), 0 0 15px rgba(251, 146, 60, 0.2); }
        }

        .star-counter.pop {
            animation: star-pop 0.4s ease-out;
        }

        @keyframes star-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* ---- HOME SCREEN ---- */
        .screen { display: none; }
        .screen.active { display: flex; }

        .home-screen {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .home-screen h1 {
            font-size: 3.5rem;
            color: var(--pink);
            text-shadow: 3px 3px 0 #FFD6E7;
            margin-bottom: 5px;
            animation: title-rainbow 4s ease-in-out infinite, title-float 3s ease-in-out infinite;
        }

        @keyframes title-rainbow {
            0%, 100% { color: var(--pink); text-shadow: 3px 3px 0 #FFD6E7; }
            25% { color: var(--purple); text-shadow: 3px 3px 0 #E9D5FF; }
            50% { color: var(--blue); text-shadow: 3px 3px 0 #BFDBFE; }
            75% { color: var(--green); text-shadow: 3px 3px 0 #BBF7D0; }
        }

        @keyframes title-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .home-screen .subtitle {
            font-size: 1.5rem;
            color: var(--purple);
            margin-bottom: 15px;
            animation: subtitle-pulse 2s ease-in-out infinite;
        }

        @keyframes subtitle-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        /* Mode toggle */
        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 35px;
        }

        .mode-btn {
            padding: 10px 28px;
            border-radius: 50px;
            border: 3px solid #E5E7EB;
            background: white;
            font-family: 'Baloo 2', cursive;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: #9CA3AF;
        }

        .mode-btn.active {
            border-color: var(--pink);
            background: var(--pink);
            color: white;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            max-width: 950px;
            width: 100%;
        }

        .category-card {
            background: white;
            border-radius: 30px;
            padding: 35px 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border: 4px solid transparent;
            user-select: none;
            animation: card-float 3s ease-in-out infinite;
        }

        .category-card:nth-child(1) { animation-delay: 0s; }
        .category-card:nth-child(2) { animation-delay: 0.3s; }
        .category-card:nth-child(3) { animation-delay: 0.6s; }
        .category-card:nth-child(4) { animation-delay: 0.9s; }
        .category-card:nth-child(5) { animation-delay: 1.2s; }
        .category-card:nth-child(6) { animation-delay: 1.5s; }
        .category-card:nth-child(7) { animation-delay: 1.8s; }
        .category-card:nth-child(8) { animation-delay: 2.1s; }

        @keyframes card-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .category-card:hover {
            transform: translateY(-8px) scale(1.08) rotate(-2deg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            animation: card-wiggle 0.5s ease-in-out infinite;
        }

        @keyframes card-wiggle {
            0%, 100% { transform: translateY(-8px) scale(1.08) rotate(-2deg); }
            50% { transform: translateY(-8px) scale(1.08) rotate(2deg); }
        }

        .category-card:active { transform: scale(0.93); }

        .category-card .icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
            display: block;
            animation: icon-bounce 2s ease-in-out infinite;
        }

        @keyframes icon-bounce {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.15) rotate(-5deg); }
            75% { transform: scale(1.15) rotate(5deg); }
        }

        .category-card .label {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .card-english { border-color: var(--blue); }
        .card-english .label { color: var(--blue); }
        .card-arabic { border-color: var(--green); }
        .card-arabic .label { color: var(--green); }
        .card-numbers { border-color: var(--orange); }
        .card-numbers .label { color: var(--orange); }
        .card-shapes { border-color: var(--purple); }
        .card-shapes .label { color: var(--purple); }
        .card-arabic-numbers { border-color: var(--red); }
        .card-arabic-numbers .label { color: var(--red); }
        .card-arabic-shapes { border-color: var(--yellow); }
        .card-arabic-shapes .label { color: var(--yellow); }
        .card-colors { border-color: var(--teal); }
        .card-colors .label { color: var(--teal); }
        .card-arabic-colors { border-color: #F472B6; }
        .card-arabic-colors .label { color: #F472B6; }

        /* ---- LESSON SCREEN ---- */
        .lesson-screen {
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .top-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-btn {
            background: white;
            border: 3px solid #E5E7EB;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--pink);
            color: white;
            border-color: var(--pink);
        }

        .lesson-title { font-size: 1.8rem; color: #6B7280; }

        .progress-text {
            font-size: 1.2rem;
            color: #9CA3AF;
            font-weight: 700;
        }

        .display-card {
            background: white;
            border-radius: 40px;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            animation: card-glow 3s ease-in-out infinite;
        }

        @keyframes card-glow {
            0%, 100% { box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
            50% { box-shadow: 0 10px 60px rgba(192, 132, 252, 0.2), 0 0 30px rgba(255, 107, 157, 0.1); }
        }

        .display-card:active { transform: scale(0.97); }

        /* Sparkle ring around display card */
        .display-card::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 44px;
            background: conic-gradient(
                var(--pink), var(--purple), var(--blue), var(--green),
                var(--yellow), var(--orange), var(--red), var(--pink)
            );
            z-index: -1;
            animation: spin-border 6s linear infinite;
            opacity: 0.3;
        }

        @keyframes spin-border {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .display-card::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 38px;
            background: white;
            z-index: -1;
        }

        .display-char {
            font-size: 12rem;
            line-height: 1;
            user-select: none;
            animation: char-float 3s ease-in-out infinite, char-glow-text 2s ease-in-out infinite;
        }

        @keyframes char-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.03); }
        }

        @keyframes char-glow-text {
            0%, 100% { filter: drop-shadow(0 0 0px transparent); }
            50% { filter: drop-shadow(0 0 20px currentColor); }
        }

        .display-name {
            font-size: 2rem;
            color: #6B7280;
            margin-top: 10px;
            animation: name-fade-float 3s ease-in-out infinite;
        }

        @keyframes name-fade-float {
            0%, 100% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(-5px); opacity: 0.8; }
        }

        .tap-hint {
            position: absolute;
            bottom: 20px;
            font-size: 1rem;
            color: #D1D5DB;
            animation: hint-blink 2s ease-in-out infinite;
        }

        @keyframes hint-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Color swatch for colors category */
        .color-swatch {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin-bottom: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            animation: swatch-pulse 2s ease-in-out infinite;
        }

        @keyframes swatch-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
            50% { transform: scale(1.08); box-shadow: 0 12px 50px rgba(0,0,0,0.25); }
        }

        .nav-arrows {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }

        .nav-btn {
            background: white;
            border: 3px solid #E5E7EB;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            font-size: 2.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            user-select: none;
        }

        .nav-btn:hover {
            border-color: var(--blue);
            color: var(--blue);
            animation: nav-jelly 0.6s ease-in-out infinite;
        }

        @keyframes nav-jelly {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15, 0.9); }
            50% { transform: scale(0.9, 1.15); }
            75% { transform: scale(1.05, 0.95); }
        }

        .nav-btn:active { transform: scale(0.85); }

        /* ---- MATCH GAME SCREEN ---- */
        .game-screen {
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-prompt {
            font-size: 1.6rem;
            color: #6B7280;
            margin-bottom: 10px;
        }

        .game-question {
            font-size: 8rem;
            line-height: 1;
            margin-bottom: 15px;
            user-select: none;
            animation: game-q-wobble 2s ease-in-out infinite;
        }

        @keyframes game-q-wobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-3deg) scale(1.05); }
            75% { transform: rotate(3deg) scale(1.05); }
        }

        .game-score {
            font-size: 1.2rem;
            color: #9CA3AF;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .game-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 500px;
            width: 100%;
            margin-bottom: 30px;
        }

        .game-option {
            background: white;
            border: 4px solid #E5E7EB;
            border-radius: 25px;
            padding: 30px 15px;
            font-size: 4rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            line-height: 1;
            animation: option-pop-in 0.4s ease-out both;
        }

        .game-option:nth-child(1) { animation-delay: 0s; }
        .game-option:nth-child(2) { animation-delay: 0.1s; }
        .game-option:nth-child(3) { animation-delay: 0.2s; }
        .game-option:nth-child(4) { animation-delay: 0.3s; }

        @keyframes option-pop-in {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            60% { transform: scale(1.1) rotate(2deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .game-option:hover {
            border-color: var(--blue);
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(96, 165, 250, 0.2);
            animation: option-hover-wobble 0.6s ease-in-out infinite;
        }

        @keyframes option-hover-wobble {
            0%, 100% { transform: scale(1.08) rotate(0deg); }
            25% { transform: scale(1.08) rotate(-3deg); }
            75% { transform: scale(1.08) rotate(3deg); }
        }

        .game-option:active { transform: scale(0.92); }

        .game-option.correct {
            border-color: var(--green);
            background: #ECFDF5;
            animation: shake-yes 0.5s ease-out;
        }

        .game-option.wrong {
            border-color: var(--red);
            background: #FEF2F2;
            animation: shake-no 0.5s ease-out;
        }

        .game-option .option-name {
            font-size: 1.1rem;
            color: #9CA3AF;
            margin-top: 5px;
        }

        @keyframes shake-yes {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake-no {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        /* Game result overlay */
        .game-result {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .game-result.active { display: flex; }

        .game-result-card {
            background: white;
            border-radius: 40px;
            padding: 50px 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: bounce-in 0.5s ease-out;
        }

        .game-result-card .trophy {
            font-size: 5rem;
            margin-bottom: 15px;
            display: block;
            animation: trophy-spin 1s ease-out, trophy-float 2s ease-in-out 1s infinite;
        }

        @keyframes trophy-spin {
            0% { transform: rotateY(0deg) scale(0); }
            60% { transform: rotateY(360deg) scale(1.2); }
            100% { transform: rotateY(360deg) scale(1); }
        }

        @keyframes trophy-float {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        .game-result-card h2 { font-size: 2rem; color: var(--pink); margin-bottom: 10px; }
        .game-result-card p { font-size: 1.3rem; color: #6B7280; margin-bottom: 25px; }

        .game-result-card .stars-earned {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
            animation: stars-twinkle 1.5s ease-in-out infinite;
        }

        @keyframes stars-twinkle {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.1); filter: brightness(1.3); }
        }

        .play-again-btn {
            padding: 15px 40px;
            border-radius: 50px;
            border: none;
            background: var(--pink);
            color: white;
            font-family: 'Baloo 2', cursive;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 5px;
        }

        .play-again-btn {
            animation: btn-breathe 2s ease-in-out infinite;
        }

        @keyframes btn-breathe {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 6px 25px rgba(255, 107, 157, 0.5); }
        }

        .play-again-btn:hover { transform: scale(1.1); animation: none; }
        .play-again-btn.secondary {
            background: white;
            color: var(--pink);
            border: 3px solid var(--pink);
        }

        /* ---- CONFETTI ---- */
        .confetti { position: fixed; pointer-events: none; z-index: 9999; }

        .confetti-piece {
            position: absolute;
            border-radius: 3px;
            animation: confetti-fall-spin ease-out forwards;
        }

        @keyframes confetti-fall-spin {
            0% { transform: translateY(0) translateX(0) rotate(0deg) scale(1); opacity: 1; }
            50% { opacity: 1; }
            100% { transform: translateY(var(--fall-y, 300px)) translateX(var(--drift-x, 0px)) rotate(var(--spin, 720deg)) scale(0.3); opacity: 0; }
        }

        @keyframes bounce-in {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }

        .bounce-in { animation: bounce-in 0.5s ease-out; }

        /* Slide in from sides */
        .slide-in-left {
            animation: slide-left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes slide-left {
            0% { transform: translateX(-100%) rotate(-20deg); opacity: 0; }
            100% { transform: translateX(0) rotate(0deg); opacity: 1; }
        }

        .slide-in-right {
            animation: slide-right 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes slide-right {
            0% { transform: translateX(100%) rotate(20deg); opacity: 0; }
            100% { transform: translateX(0) rotate(0deg); opacity: 1; }
        }

        /* Flip entrance */
        .flip-in {
            animation: flip-in 0.6s ease-out both;
        }

        @keyframes flip-in {
            0% { transform: perspective(600px) rotateY(-90deg); opacity: 0; }
            60% { transform: perspective(600px) rotateY(15deg); }
            100% { transform: perspective(600px) rotateY(0deg); opacity: 1; }
        }

        /* Stars background */
        .stars-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-star {
            position: absolute;
            animation: float-around 15s infinite ease-in-out;
        }

        @keyframes float-around {
            0% { transform: translateY(0px) translateX(0px) rotate(0deg) scale(1); opacity: 0.2; }
            25% { transform: translateY(-40px) translateX(20px) rotate(90deg) scale(1.2); opacity: 0.35; }
            50% { transform: translateY(10px) translateX(-15px) rotate(180deg) scale(0.9); opacity: 0.15; }
            75% { transform: translateY(-25px) translateX(10px) rotate(270deg) scale(1.1); opacity: 0.3; }
            100% { transform: translateY(0px) translateX(0px) rotate(360deg) scale(1); opacity: 0.2; }
        }

        /* Bubble particles */
        .bubble-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            border-radius: 50%;
            opacity: 0;
            animation: bubble-rise linear infinite;
        }

        @keyframes bubble-rise {
            0% { transform: translateX(0) scale(0); opacity: 0; }
            10% { opacity: 0.15; transform: translateX(0) scale(1); }
            90% { opacity: 0.1; }
            100% { transform: translateX(calc(var(--drift) * 1px)) scale(0.5); opacity: 0; bottom: 110vh; }
        }

        /* Rainbow wave on mode buttons */
        .mode-btn.active {
            border-color: var(--pink);
            background: var(--pink);
            color: white;
            animation: mode-glow 2s ease-in-out infinite;
        }

        @keyframes mode-glow {
            0%, 100% { box-shadow: 0 0 0px var(--pink); }
            50% { box-shadow: 0 0 20px var(--pink), 0 0 40px rgba(255, 107, 157, 0.3); }
        }

        /* Big star burst for game correct */
        .big-star-burst {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            pointer-events: none;
            z-index: 300;
            animation: big-star 0.8s ease-out forwards;
        }

        @keyframes big-star {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.5) rotate(180deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Star counter -->
    <div class="star-counter" id="starCounter">
        <span>&#11088;</span>
        <span id="starCount">0</span>
    </div>

    <!-- Floating decorative stars -->
    <div class="stars-container" id="stars"></div>

    <!-- HOME SCREEN -->
    <div class="screen home-screen active" id="homeScreen">
        <h1>Mariam's World</h1>
        <p class="subtitle">Tap to start learning!</p>

        <div class="mode-toggle">
            <button class="mode-btn active" id="modeLearn" onclick="setMode('learn')">Learn</button>
            <button class="mode-btn" id="modeGame" onclick="setMode('game')">Match Game</button>
        </div>

        <div class="categories" id="categoriesGrid"></div>
    </div>

    <!-- LESSON SCREEN -->
    <div class="screen lesson-screen" id="lessonScreen">
        <div class="top-bar">
            <button class="back-btn" onclick="goHome()">&#8592;</button>
            <span class="lesson-title" id="lessonTitle"></span>
            <span class="progress-text" id="progressText"></span>
        </div>

        <div class="display-card" id="displayCard" onclick="speakCurrent()">
            <div id="displayVisual"></div>
            <div class="display-char" id="displayChar"></div>
            <div class="display-name" id="displayName"></div>
            <div class="tap-hint">Tap to hear!</div>
        </div>

        <div class="nav-arrows">
            <button class="nav-btn" onclick="prev()">&#9664;</button>
            <button class="nav-btn" onclick="next()">&#9654;</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div class="screen game-screen" id="gameScreen">
        <div class="top-bar">
            <button class="back-btn" onclick="goHome()">&#8592;</button>
            <span class="lesson-title" id="gameTitle"></span>
            <span class="game-score" id="gameScore"></span>
        </div>

        <p class="game-prompt" id="gamePrompt">Find this one!</p>
        <div class="game-question" id="gameQuestion"></div>

        <div class="game-options" id="gameOptions"></div>
    </div>

    <!-- GAME RESULT OVERLAY -->
    <div class="game-result" id="gameResult">
        <div class="game-result-card">
            <span class="trophy" id="resultTrophy"></span>
            <h2 id="resultTitle"></h2>
            <span class="stars-earned" id="resultStars"></span>
            <p id="resultText"></p>
            <button class="play-again-btn" onclick="restartGame()">Play Again</button>
            <button class="play-again-btn secondary" onclick="goHome()">Home</button>
        </div>
    </div>

    <script>
        // ---- DATA ----
        const data = {
            english: {

                    { char: '٥', name: 'خمسة', speech: 'خَمْسَةْ' },
                    { char: '٦', name: 'ستة', speech: 'سِتَّةْ' },
                    { char: '٧', name: 'سبعة', speech: 'سَبْعَةْ' },

                    { char: '١٠', name: 'عشرة', speech: 'عَشَرَةْ' },
                    { char: '١١', name: 'أحد عشر', speech: 'أَحَدَ عَشَرَ' },
                    { char: '١٢', name: 'اثنا عشر', speech: 'اِثْنَا عَشَرَ' },
                    { char: '١٣', name: 'ثلاثة عشر', speech: 'ثَلَاثَةَ عَشَرَ' },
                    { char: '١٤', name: 'أربعة عشر', speech: 'أَرْبَعَةَ عَشَرَ' },
                    { char: '١٥', name: 'خمسة عشر', speech: 'خَمْسَةَ عَشَرَ' },
                    { char: '١٦', name: 'ستة عشر', speech: 'سِتَّةَ عَشَرَ' },
                    { char: '١٧', name: 'سبعة عشر', speech: 'سَبْعَةَ عَشَرَ' },
                    { char: '١٨', name: 'ثمانية عشر', speech: 'ثَمَانِيَةَ عَشَرَ' },

                ].map(i => ({ ...i, lang: 'ar-SA' }))
            },
            arabicShapes: {
                title: 'الأشكال بالعربي',

                    { char: '⬡', name: 'سداسي', speech: 'سُدَاسِيّ', shapeColor: '#FB923C' },
                    { char: '⭐', name: 'نجمة', speech: 'نَجْمَةْ', shapeColor: '#FACC15' },
                    { char: '💎', name: 'معين', speech: 'مُعَيَّنْ', shapeColor: '#C084FC' },

                    { char: '▬', name: 'مستطيل', speech: 'مُسْتَطِيلْ', shapeColor: '#4ADE80' },
                ].map(i => ({ ...i, lang: 'ar-SA' }))
            },
            colors: {
                title: 'Colors',
                color: '#2DD4BF',
                icon: '&#127912;',
                cardClass: 'card-colors',
                items: [
                    { char: '\u2B24', name: 'Red', shapeColor: '#EF4444' },
                    { char: '\u2B24', name: 'Blue', shapeColor: '#3B82F6' },
                    { char: '\u2B24', name: 'Green', shapeColor: '#22C55E' },
                    { char: '\u2B24', name: 'Yellow', shapeColor: '#EAB308' },
                    { char: '\u2B24', name: 'Orange', shapeColor: '#F97316' },
                    { char: '\u2B24', name: 'Purple', shapeColor: '#A855F7' },
                    { char: '\u2B24', name: 'Pink', shapeColor: '#EC4899' },
                    { char: '\u2B24', name: 'Brown', shapeColor: '#92400E' },
                    { char: '\u2B24', name: 'Black', shapeColor: '#1F2937' },
                    { char: '\u2B24', name: 'White', shapeColor: '#F9FAFB' },
                ].map(i => ({ ...i, speech: i.name, lang: 'en-US', isColor: true }))
            },
            arabicColors: {
                title: 'الألوان',
                color: '#F472B6',
                icon: '&#127912;',
                cardClass: 'card-arabic-colors',
                items: [
                    { char: '⬤', name: 'أحمر', speech: 'أَحْمَرْ', shapeColor: '#EF4444' },
                    { char: '⬤', name: 'أزرق', speech: 'أَزْرَقْ', shapeColor: '#3B82F6' },
                    { char: '⬤', name: 'أخضر', speech: 'أَخْضَرْ', shapeColor: '#22C55E' },
                    { char: '⬤', name: 'أصفر', speech: 'أَصْفَرْ', shapeColor: '#EAB308' },
                    { char: '⬤', name: 'برتقالي', speech: 'بُرْتُقَالِيّ', shapeColor: '#F97316' },
                    { char: '⬤', name: 'بنفسجي', speech: 'بَنَفْسَجِيّ', shapeColor: '#A855F7' },
                    { char: '⬤', name: 'وردي', speech: 'وَرْدِيّ', shapeColor: '#EC4899' },
                    { char: '⬤', name: 'بني', speech: 'بُنِّيّ', shapeColor: '#92400E' },
                    { char: '⬤', name: 'أسود', speech: 'أَسْوَدْ', shapeColor: '#1F2937' },
                    { char: '⬤', name: 'أبيض', speech: 'أَبْيَضْ', shapeColor: '#F9FAFB' },
                ].map(i => ({ ...i, lang: 'ar-SA', isColor: true }))
            }
        };

        const arabicCategories = ['arabic', 'arabicNumbers', 'arabicShapes', 'arabicColors'];
        const shapeCategories = ['shapes', 'arabicShapes'];
        const colorCategories = ['colors', 'arabicColors'];

        let currentMode = 'learn';
        let currentCategory = null;
        let currentIndex = 0;

        // ---- STARS ----
        let totalStars = parseInt(localStorage.getItem('mariam-stars') || '0');

        function updateStarDisplay() {
            document.getElementById('starCount').textContent = totalStars;
        }

        function addStars(count) {
            totalStars += count;
            localStorage.setItem('mariam-stars', totalStars);
            updateStarDisplay();
            const el = document.getElementById('starCounter');
            el.classList.remove('pop');
            void el.offsetWidth;
            el.classList.add('pop');

            // Show big star
            const star = document.createElement('div');
            star.className = 'big-star-burst';
            star.textContent = count >= 3 ? '\u2B50\u2B50\u2B50' : count >= 2 ? '\u2B50\u2B50' : '\u2B50';
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 900);
        }

        updateStarDisplay();

        // ---- MODE TOGGLE ----
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeLearn').classList.toggle('active', mode === 'learn');
            document.getElementById('modeGame').classList.toggle('active', mode === 'game');
            renderCategories();
        }

        // ---- RENDER HOME CATEGORIES ----
        function renderCategories() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = '';
            const cats = Object.entries(data);
            cats.forEach(([key, cat]) => {
                const card = document.createElement('div');
                card.className = `category-card ${cat.cardClass}`;
                card.innerHTML = `<span class="icon">${cat.icon}</span><span class="label">${cat.title}</span>`;
                card.onclick = () => {
                    if (currentMode === 'learn') startLesson(key);
                    else startGame(key);
                };
                grid.appendChild(card);
            });
        }

        renderCategories();

        // ---- SCREEN MANAGEMENT ----
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goHome() {
            showScreen('homeScreen');
            currentCategory = null;
            speechSynthesis.cancel();
            document.getElementById('gameResult').classList.remove('active');
        }

        // ---- LESSON MODE ----
        function startLesson(category) {
            currentCategory = category;
            currentIndex = 0;
            showScreen('lessonScreen');
            showItem();
        }

        function next() {
            const items = data[currentCategory].items;
            currentIndex = (currentIndex + 1) % items.length;
            showItem();
            burstConfetti();
        }

        function prev() {
            const items = data[currentCategory].items;
            currentIndex = (currentIndex - 1 + items.length) % items.length;
            showItem();
        }

        function showItem() {
            const cat = data[currentCategory];
            const item = cat.items[currentIndex];

            document.getElementById('lessonTitle').textContent = cat.title;
            document.getElementById('lessonTitle').style.color = cat.color;
            document.getElementById('progressText').textContent =
                `${currentIndex + 1} / ${cat.items.length}`;

            const charEl = document.getElementById('displayChar');
            const nameEl = document.getElementById('displayName');
            const visualEl = document.getElementById('displayVisual');

            // Pick a random entrance animation
            const entrances = ['bounce-in', 'flip-in', 'slide-in-left', 'slide-in-right'];
            const entrance = entrances[Math.floor(Math.random() * entrances.length)];

            charEl.className = `display-char ${entrance}`;
            nameEl.className = 'display-name';
            charEl.style.color = cat.color;
            visualEl.innerHTML = '';

            const isArabic = arabicCategories.includes(currentCategory);
            if (isArabic) {
                charEl.classList.add('arabic-text');
                nameEl.classList.add('arabic-text');
            }

            // Color category: show a big colored circle
            if (item.isColor) {
                const swatch = document.createElement('div');
                swatch.className = `color-swatch ${entrance}`;
                swatch.style.background = item.shapeColor;
                if (item.shapeColor === '#F9FAFB') {
                    swatch.style.border = '4px solid #E5E7EB';
                }
                visualEl.appendChild(swatch);
                charEl.textContent = '';
                nameEl.textContent = item.name;
                nameEl.style.fontSize = isArabic ? '2.5rem' : '2.2rem';
            } else if (shapeCategories.includes(currentCategory)) {
                charEl.style.fontSize = '10rem';
                if (item.shapeColor) charEl.style.color = item.shapeColor;
                charEl.textContent = item.char;
                nameEl.textContent = item.name;
            } else {
                charEl.style.fontSize = '12rem';
                charEl.textContent = item.char;
                nameEl.textContent = item.name;
            }

            setTimeout(() => speakCurrent(), 300);
        }

        function speakCurrent() {
            if (!currentCategory) return;
            const item = data[currentCategory].items[currentIndex];
            speak(item.speech, item.lang);
        }

        function speak(text, lang) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.8;
            utterance.pitch = 1.1;
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        }

        // ---- MATCH GAME ----
        let gameItems = [];
        let gameIndex = 0;
        let gameCorrect = 0;
        let gameTotal = 10;
        let gameLocked = false;

        function startGame(category) {
            currentCategory = category;
            const cat = data[category];
            // Pick random items for the game
            const shuffled = [...cat.items].sort(() => Math.random() - 0.5);
            gameTotal = Math.min(10, cat.items.length);
            gameItems = shuffled.slice(0, gameTotal);
            gameIndex = 0;
            gameCorrect = 0;
            gameLocked = false;

            document.getElementById('gameTitle').textContent = cat.title;
            document.getElementById('gameTitle').style.color = cat.color;
            showScreen('gameScreen');
            showGameRound();
        }

        function showGameRound() {
            if (gameIndex >= gameItems.length) {
                showGameResult();
                return;
            }

            gameLocked = false;
            const cat = data[currentCategory];
            const correct = gameItems[gameIndex];
            const isArabic = arabicCategories.includes(currentCategory);

            document.getElementById('gameScore').textContent =
                `${gameIndex + 1} / ${gameTotal}`;

            // Prompt text
            const prompt = document.getElementById('gamePrompt');
            if (isArabic) {
                prompt.textContent = '\u0627\u0639\u062B\u0631 \u0639\u0644\u0649 \u0647\u0630\u0627!';
                prompt.classList.add('arabic-text');
            } else {
                prompt.textContent = 'Find this one!';
                prompt.classList.remove('arabic-text');
            }

            // Question display
            const qEl = document.getElementById('gameQuestion');
            qEl.className = 'game-question bounce-in';
            if (isArabic) qEl.classList.add('arabic-text');

            if (correct.isColor) {
                qEl.innerHTML = `<div style="width:120px;height:120px;border-radius:50%;background:${correct.shapeColor};margin:0 auto;${correct.shapeColor === '#F9FAFB' ? 'border:4px solid #E5E7EB;' : ''}"></div>`;
            } else {
                qEl.textContent = correct.char;
                qEl.style.color = correct.shapeColor || cat.color;
            }

            // Speak the name
            setTimeout(() => speak(correct.speech, correct.lang), 300);

            // Build 4 options: 1 correct + 3 wrong
            const allItems = cat.items.filter(i => i.name !== correct.name);
            const wrongItems = allItems.sort(() => Math.random() - 0.5).slice(0, 3);
            const options = [correct, ...wrongItems].sort(() => Math.random() - 0.5);

            const optionsEl = document.getElementById('gameOptions');
            optionsEl.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'game-option';
                if (isArabic) btn.classList.add('arabic-text');

                if (opt.isColor) {
                    btn.innerHTML = `<div style="font-size:1.8rem;font-weight:700;${isArabic ? "font-family:'Noto Naskh Arabic',serif;" : ''}">${opt.name}</div>`;
                } else {
                    btn.innerHTML = `<div style="color:${opt.shapeColor || cat.color}">${opt.char}</div>
                        <div class="option-name ${isArabic ? 'arabic-text' : ''}">${opt.name}</div>`;
                }

                btn.onclick = () => handleAnswer(btn, opt, correct);
                optionsEl.appendChild(btn);
            });
        }

        function handleAnswer(btn, selected, correct) {
            if (gameLocked) return;
            gameLocked = true;

            if (selected.name === correct.name) {
                btn.classList.add('correct');
                gameCorrect++;
                addStars(1);
                burstConfetti();
                speak(correct.isColor ? correct.name : correct.speech, correct.lang);
            } else {
                btn.classList.add('wrong');
                // Highlight the correct one
                document.querySelectorAll('.game-option').forEach(el => {
                    const nameInEl = el.querySelector('.option-name');
                    const textInEl = el.textContent.trim();
                    if (textInEl.includes(correct.name) || (nameInEl && nameInEl.textContent === correct.name)) {
                        el.classList.add('correct');
                    }
                });
            }

            setTimeout(() => {
                gameIndex++;
                showGameRound();
            }, 1200);
        }

        function showGameResult() {
            const starsEarned = gameCorrect >= gameTotal ? 3 :
                               gameCorrect >= gameTotal * 0.7 ? 2 :
                               gameCorrect >= gameTotal * 0.4 ? 1 : 0;

            if (starsEarned > 1) addStars(starsEarned - gameCorrect); // bonus stars

            const resultEl = document.getElementById('gameResult');
            document.getElementById('resultTrophy').textContent =
                gameCorrect === gameTotal ? '\uD83C\uDFC6' : gameCorrect >= gameTotal * 0.7 ? '\uD83C\uDF89' : '\uD83D\uDCAA';
            document.getElementById('resultTitle').textContent =
                gameCorrect === gameTotal ? 'Perfect!' :
                gameCorrect >= gameTotal * 0.7 ? 'Great Job!' : 'Keep Trying!';
            document.getElementById('resultStars').textContent =
                '\u2B50'.repeat(starsEarned) + '\u2606'.repeat(3 - starsEarned);
            document.getElementById('resultText').textContent =
                `${gameCorrect} out of ${gameTotal} correct!`;

            resultEl.classList.add('active');
            burstConfetti();
            burstConfetti();
        }

        function restartGame() {
            document.getElementById('gameResult').classList.remove('active');
            startGame(currentCategory);
        }

        // ---- CONFETTI ----
        function burstConfetti() {
            const colors = ['#FF6B9D', '#C084FC', '#60A5FA', '#4ADE80', '#FACC15', '#FB923C', '#F87171'];
            const shapes = ['circle', 'rect', 'star'];
            const container = document.createElement('div');
            container.className = 'confetti';
            container.style.left = '50%';
            container.style.top = '35%';
            document.body.appendChild(container);

            for (let i = 0; i < 35; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                const shape = shapes[Math.floor(Math.random() * shapes.length)];
                const size = 6 + Math.random() * 12;
                piece.style.width = size + 'px';
                piece.style.height = shape === 'circle' ? size + 'px' : size * 0.6 + 'px';
                piece.style.borderRadius = shape === 'circle' ? '50%' : '2px';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.left = (Math.random() - 0.5) * 500 + 'px';
                piece.style.setProperty('--fall-y', (200 + Math.random() * 200) + 'px');
                piece.style.setProperty('--drift-x', (Math.random() - 0.5) * 200 + 'px');
                piece.style.setProperty('--spin', (360 + Math.random() * 720) + 'deg');
                piece.style.animationDelay = Math.random() * 0.4 + 's';
                piece.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
                container.appendChild(piece);
            }
            setTimeout(() => container.remove(), 2000);
        }

        // ---- FLOATING STARS ----
        function createStars() {
            const container = document.getElementById('stars');
            const emojis = ['\u2B50', '\uD83C\uDF1F', '\u2728', '\uD83D\uDCAB', '\uD83C\uDF08', '\u2764\uFE0F', '\uD83E\uDD8B'];
            for (let i = 0; i < 20; i++) {
                const star = document.createElement('div');
                star.className = 'floating-star';
                star.textContent = emojis[i % emojis.length];
                star.style.fontSize = (18 + Math.random() * 35) + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = -(Math.random() * 15) + 's';
                star.style.animationDuration = (10 + Math.random() * 15) + 's';
                container.appendChild(star);
            }
        }

        // ---- BUBBLE PARTICLES ----
        function createBubbles() {
            const container = document.createElement('div');
            container.className = 'bubble-container';
            document.body.appendChild(container);

            const colors = ['rgba(255,107,157,0.2)', 'rgba(192,132,252,0.2)', 'rgba(96,165,250,0.2)',
                           'rgba(74,222,128,0.2)', 'rgba(250,204,21,0.2)', 'rgba(251,146,60,0.2)'];

            function spawnBubble() {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = 15 + Math.random() * 40;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.background = colors[Math.floor(Math.random() * colors.length)];
                bubble.style.setProperty('--drift', (Math.random() - 0.5) * 200);
                bubble.style.animationDuration = (8 + Math.random() * 12) + 's';
                container.appendChild(bubble);

                setTimeout(() => bubble.remove(), 20000);
            }

            // Spawn initial batch
            for (let i = 0; i < 8; i++) {
                setTimeout(() => spawnBubble(), i * 500);
            }

            // Keep spawning
            setInterval(spawnBubble, 2000);
        }

        // ---- KEYBOARD SUPPORT ----
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('lessonScreen').classList.contains('active')) {
                if (e.key === 'ArrowRight') next();
                if (e.key === 'ArrowLeft') prev();
                if (e.key === ' ') speakCurrent();
            }
            if (e.key === 'Escape') goHome();
        });

        createStars();
        createBubbles();
    </script>
</body>
</html>
