<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariam's Learning World</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink: #FF6B9D;
            --purple: #C084FC;
            --blue: #60A5FA;
            --green: #4ADE80;
            --yellow: #FACC15;
            --orange: #FB923C;
            --red: #F87171;
            --bg: #FFF7ED;
        }

        body {
            font-family: 'Baloo 2', cursive;
            background: var(--bg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ---- HOME SCREEN ---- */
        .home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .home-screen h1 {
            font-size: 3.5rem;
            color: var(--pink);
            text-shadow: 3px 3px 0 #FFD6E7;
            margin-bottom: 10px;
        }

        .home-screen .subtitle {
            font-size: 1.5rem;
            color: var(--purple);
            margin-bottom: 50px;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            max-width: 900px;
            width: 100%;
        }

        .category-card {
            background: white;
            border-radius: 30px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border: 4px solid transparent;
            user-select: none;
        }

        .category-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .category-card:active {
            transform: scale(0.97);
        }

        .category-card .icon {
            font-size: 4rem;
            margin-bottom: 15px;
            display: block;
        }

        .category-card .label {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .card-english { border-color: var(--blue); }
        .card-english .label { color: var(--blue); }

        .card-arabic { border-color: var(--green); }
        .card-arabic .label { color: var(--green); }

        .card-numbers { border-color: var(--orange); }
        .card-numbers .label { color: var(--orange); }

        .card-shapes { border-color: var(--purple); }
        .card-shapes .label { color: var(--purple); }

        .card-arabic-numbers { border-color: var(--red); }
        .card-arabic-numbers .label { color: var(--red); }

        .card-arabic-shapes { border-color: var(--yellow); }
        .card-arabic-shapes .label { color: var(--yellow); }

        /* ---- LESSON SCREEN ---- */
        .lesson-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .top-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-btn {
            background: white;
            border: 3px solid #E5E7EB;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--pink);
            color: white;
            border-color: var(--pink);
        }

        .lesson-title {
            font-size: 1.8rem;
            color: #6B7280;
        }

        .progress-text {
            font-size: 1.2rem;
            color: #9CA3AF;
            font-weight: 700;
        }

        /* Main display card */
        .display-card {
            background: white;
            border-radius: 40px;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .display-card:active {
            transform: scale(0.97);
        }

        .display-char {
            font-size: 12rem;
            line-height: 1;
            user-select: none;
        }

        .display-char.arabic {
            font-family: 'Noto Naskh Arabic', serif;
        }

        .display-name {
            font-size: 2rem;
            color: #6B7280;
            margin-top: 10px;
        }

        .display-name.arabic {
            font-family: 'Noto Naskh Arabic', serif;
            font-size: 2.2rem;
        }

        .tap-hint {
            position: absolute;
            bottom: 20px;
            font-size: 1rem;
            color: #D1D5DB;
        }

        /* Navigation arrows */
        .nav-arrows {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }

        .nav-btn {
            background: white;
            border: 3px solid #E5E7EB;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            font-size: 2.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            user-select: none;
        }

        .nav-btn:hover {
            border-color: var(--blue);
            color: var(--blue);
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        /* Shapes specific */
        .shape-svg {
            width: 200px;
            height: 200px;
        }

        /* Confetti burst on tap */
        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: confetti-fall 1s ease-out forwards;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(200px) rotate(720deg); opacity: 0; }
        }

        /* Bounce animation on display */
        @keyframes bounce-in {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }

        .bounce-in {
            animation: bounce-in 0.5s ease-out;
        }

        /* Stars animation */
        .stars-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-star {
            position: absolute;
            opacity: 0.15;
            animation: float-around 20s infinite ease-in-out;
        }

        @keyframes float-around {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-30px) rotate(90deg); }
            50% { transform: translateY(10px) rotate(180deg); }
            75% { transform: translateY(-20px) rotate(270deg); }
        }
    </style>
</head>
<body>

    <!-- Floating decorative stars -->
    <div class="stars-container" id="stars"></div>

    <!-- HOME SCREEN -->
    <div class="home-screen" id="homeScreen">
        <h1>Mariam's World</h1>
        <p class="subtitle">Tap to start learning!</p>
        <div class="categories">
            <div class="category-card card-english" onclick="startLesson('english')">
                <span class="icon">🔤</span>
                <span class="label">English Letters</span>
            </div>
            <div class="category-card card-arabic" onclick="startLesson('arabic')">
                <span class="icon">🕌</span>
                <span class="label">Arabic Letters</span>
            </div>
            <div class="category-card card-numbers" onclick="startLesson('numbers')">
                <span class="icon">🔢</span>
                <span class="label">Numbers</span>
            </div>
            <div class="category-card card-shapes" onclick="startLesson('shapes')">
                <span class="icon">🔷</span>
                <span class="label">Shapes</span>
            </div>
            <div class="category-card card-arabic-numbers" onclick="startLesson('arabicNumbers')">
                <span class="icon">🔢</span>
                <span class="label">الأرقام العربية</span>
            </div>
            <div class="category-card card-arabic-shapes" onclick="startLesson('arabicShapes')">
                <span class="icon">🔶</span>
                <span class="label">الأشكال بالعربي</span>
            </div>
        </div>
    </div>

    <!-- LESSON SCREEN -->
    <div class="lesson-screen" id="lessonScreen">
        <div class="top-bar">
            <button class="back-btn" onclick="goHome()">←</button>
            <span class="lesson-title" id="lessonTitle"></span>
            <span class="progress-text" id="progressText"></span>
        </div>

        <div class="display-card" id="displayCard" onclick="speakCurrent()">
            <div class="display-char" id="displayChar"></div>
            <div class="display-name" id="displayName"></div>
            <div class="tap-hint">Tap to hear!</div>
        </div>

        <div class="nav-arrows">
            <button class="nav-btn" onclick="prev()">◀</button>
            <button class="nav-btn" onclick="next()">▶</button>
        </div>
    </div>

    <script>
        // ---- DATA ----
        const data = {
            english: {
                title: 'English Letters',
                color: '#60A5FA',
                items: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c => ({
                    char: c,
                    name: c,
                    speech: c,
                    lang: 'en-US'
                }))
            },
            arabic: {
                title: 'Arabic Letters',
                color: '#4ADE80',
                items: [
                    { char: 'أ', name: 'ألف' }, { char: 'ب', name: 'باء' },
                    { char: 'ت', name: 'تاء' }, { char: 'ث', name: 'ثاء' },
                    { char: 'ج', name: 'جيم' }, { char: 'ح', name: 'حاء' },
                    { char: 'خ', name: 'خاء' }, { char: 'د', name: 'دال' },
                    { char: 'ذ', name: 'ذال' }, { char: 'ر', name: 'راء' },
                    { char: 'ز', name: 'زاي' }, { char: 'س', name: 'سين' },
                    { char: 'ش', name: 'شين' }, { char: 'ص', name: 'صاد' },
                    { char: 'ض', name: 'ضاد' }, { char: 'ط', name: 'طاء' },
                    { char: 'ظ', name: 'ظاء' }, { char: 'ع', name: 'عين' },
                    { char: 'غ', name: 'غين' }, { char: 'ف', name: 'فاء' },
                    { char: 'ق', name: 'قاف' }, { char: 'ك', name: 'كاف' },
                    { char: 'ل', name: 'لام' }, { char: 'م', name: 'ميم' },
                    { char: 'ن', name: 'نون' }, { char: 'ه', name: 'هاء' },
                    { char: 'و', name: 'واو' }, { char: 'ي', name: 'ياء' },
                ].map(i => ({ ...i, speech: i.name, lang: 'ar-SA' }))
            },
            numbers: {
                title: 'Numbers',
                color: '#FB923C',
                items: Array.from({ length: 20 }, (_, i) => ({
                    char: String(i + 1),
                    name: (i + 1).toString(),
                    speech: String(i + 1),
                    lang: 'en-US'
                }))
            },
            shapes: {
                title: 'Shapes',
                color: '#C084FC',
                items: [
                    { char: '●', name: 'Circle', svg: 'circle', shapeColor: '#60A5FA' },
                    { char: '■', name: 'Square', svg: 'square', shapeColor: '#F87171' },
                    { char: '▲', name: 'Triangle', svg: 'triangle', shapeColor: '#4ADE80' },
                    { char: '⬟', name: 'Pentagon', svg: 'pentagon', shapeColor: '#FACC15' },
                    { char: '⬡', name: 'Hexagon', svg: 'hexagon', shapeColor: '#FB923C' },
                    { char: '⭐', name: 'Star', svg: 'star', shapeColor: '#FACC15' },
                    { char: '💎', name: 'Diamond', svg: 'diamond', shapeColor: '#C084FC' },
                    { char: '♥', name: 'Heart', svg: 'heart', shapeColor: '#FF6B9D' },
                ].map(i => ({ ...i, speech: i.name, lang: 'en-US' }))
            },
            arabicNumbers: {
                title: 'الأرقام العربية',
                color: '#F87171',
                items: [
                    { char: '١', name: 'واحد' }, { char: '٢', name: 'اثنان' },
                    { char: '٣', name: 'ثلاثة' }, { char: '٤', name: 'أربعة' },
                    { char: '٥', name: 'خمسة' }, { char: '٦', name: 'ستة' },
                    { char: '٧', name: 'سبعة' }, { char: '٨', name: 'ثمانية' },
                    { char: '٩', name: 'تسعة' }, { char: '١٠', name: 'عشرة' },
                    { char: '١١', name: 'أحد عشر' }, { char: '١٢', name: 'اثنا عشر' },
                    { char: '١٣', name: 'ثلاثة عشر' }, { char: '١٤', name: 'أربعة عشر' },
                    { char: '١٥', name: 'خمسة عشر' }, { char: '١٦', name: 'ستة عشر' },
                    { char: '١٧', name: 'سبعة عشر' }, { char: '١٨', name: 'ثمانية عشر' },
                    { char: '١٩', name: 'تسعة عشر' }, { char: '٢٠', name: 'عشرون' },
                ].map(i => ({ ...i, speech: i.name, lang: 'ar-SA' }))
            },
            arabicShapes: {
                title: 'الأشكال بالعربي',
                color: '#FACC15',
                items: [
                    { char: '●', name: 'دائرة', shapeColor: '#60A5FA' },
                    { char: '■', name: 'مربع', shapeColor: '#F87171' },
                    { char: '▲', name: 'مثلث', shapeColor: '#4ADE80' },
                    { char: '⬟', name: 'خماسي', shapeColor: '#FACC15' },
                    { char: '⬡', name: 'سداسي', shapeColor: '#FB923C' },
                    { char: '⭐', name: 'نجمة', shapeColor: '#FACC15' },
                    { char: '💎', name: 'معين', shapeColor: '#C084FC' },
                    { char: '♥', name: 'قلب', shapeColor: '#FF6B9D' },
                    { char: '⬭', name: 'بيضاوي', shapeColor: '#60A5FA' },
                    { char: '▬', name: 'مستطيل', shapeColor: '#4ADE80' },
                ].map(i => ({ ...i, speech: i.name, lang: 'ar-SA' }))
            }
        };

        let currentCategory = null;
        let currentIndex = 0;

        // ---- NAVIGATION ----
        function startLesson(category) {
            currentCategory = category;
            currentIndex = 0;
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('lessonScreen').style.display = 'flex';
            showItem();
        }

        function goHome() {
            document.getElementById('homeScreen').style.display = 'flex';
            document.getElementById('lessonScreen').style.display = 'none';
            currentCategory = null;
        }

        function next() {
            const items = data[currentCategory].items;
            currentIndex = (currentIndex + 1) % items.length;
            showItem();
            burstConfetti();
        }

        function prev() {
            const items = data[currentCategory].items;
            currentIndex = (currentIndex - 1 + items.length) % items.length;
            showItem();
        }

        function showItem() {
            const cat = data[currentCategory];
            const item = cat.items[currentIndex];

            document.getElementById('lessonTitle').textContent = cat.title;
            document.getElementById('lessonTitle').style.color = cat.color;
            document.getElementById('progressText').textContent =
                `${currentIndex + 1} / ${cat.items.length}`;

            const charEl = document.getElementById('displayChar');
            const nameEl = document.getElementById('displayName');

            charEl.className = 'display-char bounce-in';
            charEl.style.color = cat.color;

            const isArabic = ['arabic', 'arabicNumbers', 'arabicShapes'].includes(currentCategory);
            if (isArabic) {
                charEl.classList.add('arabic');
                nameEl.classList.add('arabic');
            } else {
                charEl.classList.remove('arabic');
                nameEl.classList.remove('arabic');
            }

            if (currentCategory === 'shapes' || currentCategory === 'arabicShapes') {
                charEl.style.fontSize = '10rem';
                if (item.shapeColor) charEl.style.color = item.shapeColor;
            } else {
                charEl.style.fontSize = '12rem';
            }

            charEl.textContent = item.char;
            nameEl.textContent = item.name;

            // Auto-speak
            setTimeout(() => speakCurrent(), 300);
        }

        // ---- SPEECH ----
        function speakCurrent() {
            if (!currentCategory) return;
            const item = data[currentCategory].items[currentIndex];
            const utterance = new SpeechSynthesisUtterance(item.speech);
            utterance.lang = item.lang;
            utterance.rate = 0.8;
            utterance.pitch = 1.1;
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        }

        // ---- CONFETTI ----
        function burstConfetti() {
            const colors = ['#FF6B9D', '#C084FC', '#60A5FA', '#4ADE80', '#FACC15', '#FB923C'];
            const container = document.createElement('div');
            container.className = 'confetti';
            container.style.left = '50%';
            container.style.top = '40%';
            document.body.appendChild(container);

            for (let i = 0; i < 20; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.left = (Math.random() - 0.5) * 300 + 'px';
                piece.style.animationDelay = Math.random() * 0.3 + 's';
                piece.style.animationDuration = (0.6 + Math.random() * 0.6) + 's';
                container.appendChild(piece);
            }

            setTimeout(() => container.remove(), 1500);
        }

        // ---- FLOATING STARS ----
        function createStars() {
            const container = document.getElementById('stars');
            const emojis = ['⭐', '🌟', '✨', '💫'];
            for (let i = 0; i < 12; i++) {
                const star = document.createElement('div');
                star.className = 'floating-star';
                star.textContent = emojis[i % emojis.length];
                star.style.fontSize = (20 + Math.random() * 30) + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = -(Math.random() * 20) + 's';
                container.appendChild(star);
            }
        }

        // ---- KEYBOARD SUPPORT ----
        document.addEventListener('keydown', (e) => {
            if (!currentCategory) return;
            if (e.key === 'ArrowRight') next();
            if (e.key === 'ArrowLeft') prev();
            if (e.key === ' ') speakCurrent();
            if (e.key === 'Escape') goHome();
        });

        createStars();
    </script>
</body>
</html>
