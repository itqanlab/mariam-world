<div class="game-screen">
  <div class="top-bar">
    <button class="back-btn" (click)="goHome()">&larr;</button>
    <span class="lesson-title" [style.color]="category.color">{{ category.title }}</span>
    <span class="game-score">{{ progress }}</span>
  </div>

  <p class="game-prompt" [class.arabic-text]="isArabic">{{ promptText }}</p>

  <div class="game-question bounce-in" [class.arabic-text]="isArabic">
    @if (currentItem.isColor) {
      <div class="color-circle"
           [style.background]="currentItem.shapeColor"
           [style.border]="currentItem.shapeColor === '#F9FAFB' ? '4px solid #E5E7EB' : 'none'">
      </div>
    } @else {
      <span [style.color]="currentItem.shapeColor || category.color">{{ currentItem.char }}</span>
    }
  </div>

  <div class="game-options">
    @for (option of options; track option.item.name) {
      <div class="game-option"
           [class.arabic-text]="isArabic"
           [class.correct]="option.state === 'correct'"
           [class.wrong]="option.state === 'wrong'"
           (click)="handleAnswer(option)">
        @if (option.item.isColor) {
          <div style="font-size: 1.8rem; font-weight: 700;" [class.arabic-text]="isArabic">
            {{ option.item.name }}
          </div>
        } @else {
          <div [style.color]="option.item.shapeColor || category.color">{{ option.item.char }}</div>
          <div class="option-name" [class.arabic-text]="isArabic">{{ option.item.name }}</div>
        }
      </div>
    }
  </div>
</div>

<app-game-result
  [visible]="showResult"
  [trophy]="resultTrophy"
  [title]="resultTitle"
  [starsDisplay]="resultStars"
  [text]="resultText"
  (playAgain)="startGame()"
  (goHome)="goHome()"
/>
